name: Deploy Functions & Rules

# functions/ 또는 보안규칙이 바뀐 채로 main에 머지되면 모든 기관에 자동 배포한다.
# 기관마다 Firebase 프로젝트가 달라 배포도 따로 이뤄지므로, 한쪽만 반영되면
# 같은 화면이 기관마다 다르게 동작한다(옛 함수가 그대로 떠 있는 상태).
# 그 사고를 막기 위해 기본값을 '전체'로 두고, 필요할 때만 한 기관을 골라 실행한다.
#
# ⚠️ 기본 기관(astc-lms)의 Firestore 규칙은 여기서 배포하지 않는다 — 이 프로젝트의 규칙은
#   Video Vault와 공유되어, 이 저장소의 firestore.rules 단독 배포 시 vault 규칙이 삭제된다.
#   해당 배포는 astc-video-vault 저장소의 병합본으로만 수행한다.
#   추가 기관 프로젝트는 vault와 무관하므로 Firestore 규칙까지 함께 배포한다.
on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "rtdb.rules.json"
      # 추가 기관 job이 Firestore 규칙까지 배포한다 — 규칙만 고친 머지도 잡아야 한다.
      # (기본 기관은 여기서 규칙을 배포하지 않으므로 영향 없음.)
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "배포 대상"
        type: choice
        default: all
        options:
          - all       # 전체 기관(기본값 — push 자동 배포와 동일)
          - default   # 기본 기관(astc-lms)만 — 함수·RTDB 규칙
          - atc       # 항공훈련센터만 — 함수 + Firestore 규칙

# 배포 1건만 실행(동시 배포 충돌 방지). 기관별 job은 이 안에서 함께 돈다.
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  # ──────────────── 기본 기관 (astc-lms) ────────────────
  default:
    # push에는 inputs가 없다 — 자동 배포는 전체 기관이 대상이다.
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","default"]'), inputs.target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Check secrets
        id: check
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT secret이 없어 배포를 건너뜁니다. README의 '함수 자동 배포' 절차를 참고하세요."
            echo "ok=false" >> $GITHUB_OUTPUT
          else
            echo "ok=true" >> $GITHUB_OUTPUT
          fi

      - uses: google-github-actions/auth@v2
        if: steps.check.outputs.ok == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Firestore 규칙 제외 — vault와 공유되는 프로젝트라 단독 배포 시 vault 규칙이 지워진다.
      - name: Deploy functions & RTDB rules
        if: steps.check.outputs.ok == 'true'
        run: npx --yes firebase-tools@latest deploy
          --only functions,database
          --project "${{ secrets.FIREBASE_PROJECT_ID }}"
          --non-interactive --force

  # ──────────────── 항공훈련센터 (별도 프로젝트) ────────────────
  atc:
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","atc"]'), inputs.target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      # 이 기관만 콕 집어 실행했는데 시크릿이 없으면 실패로 알린다(요청이 조용히 무시되면 안 된다).
      # 전체 배포에서는 경고만 남기고 건너뛴다 — 기본 기관 배포까지 막을 이유가 없다.
      - name: Check secrets
        id: check
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_ATC }}" ] || [ -z "${{ secrets.FIREBASE_PROJECT_ID_ATC }}" ]; then
            if [ "${{ inputs.target }}" = "atc" ]; then
              echo "::error::FIREBASE_SERVICE_ACCOUNT_ATC / FIREBASE_PROJECT_ID_ATC secret이 필요합니다. README의 '추가 기관 배포' 절차를 참고하세요."
              exit 1
            fi
            echo "::warning::항공훈련센터 시크릿이 없어 이 기관 배포를 건너뜁니다(다른 기관은 그대로 진행). README의 '추가 기관 배포' 절차를 참고하세요."
            echo "ok=false" >> $GITHUB_OUTPUT
          else
            echo "ok=true" >> $GITHUB_OUTPUT
          fi

      - uses: google-github-actions/auth@v2
        if: steps.check.outputs.ok == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ATC }}

      # 이 프로젝트는 vault와 규칙을 공유하지 않으므로 Firestore 규칙까지 함께 배포한다.
      # RTDB(database)는 대상에서 뺀다 — 실시간 DB를 쓰는 기능은 퀴즈·히어로 미션뿐이고
      # 이들은 추가 기관에서도 기본 기관 백엔드로 연결되는 링크라(orgs.js) 인스턴스가 없다.
      # 넣어두면 "haven't created a Realtime Database instance"로 배포 전체가 멈춘다.
      - name: Deploy functions & Firestore rules
        if: steps.check.outputs.ok == 'true'
        run: npx --yes firebase-tools@latest deploy
          --only functions,firestore:rules
          --project "${{ secrets.FIREBASE_PROJECT_ID_ATC }}"
          --non-interactive --force

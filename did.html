<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAC 항공보안교육센터</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- 구형 TV 브라우저(webOS 등, 크로뮴 50~60급) 호환:
     ES 모듈·최신 문법 미사용, Firebase v8 클래식 SDK, CSS gap/inset 미사용. -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    color: #0c2a52; background: #e9eff7; overflow: hidden;
  }
  #bg {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background-size: cover; background-position: center;
    background-image: linear-gradient(165deg, #f4f8fc 0%, #e9eff7 60%, #d9e4f1 100%);
  }
  /* 배경 이미지 사용 시: 밝은 반투명 오버레이로 네이비 텍스트 가독성 유지 */
  #bg-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(238,243,249,0.6); display: none; }
  .wrap { position: relative; height: 100vh; display: flex; flex-direction: column; padding: 2.2vh 2.5vw; }

  header { display: flex; align-items: center; margin-bottom: 2vh; }
  #logo { max-height: 14vh; max-width: 30vw; margin-right: 1.5vw; }
  #title { font-size: 3.6vh; font-weight: 900; letter-spacing: 0.05em; }
  .clockbox { margin-left: auto; text-align: right; }
  #date { font-size: 2.2vh; opacity: 0.85; }
  #clock { font-size: 4.6vh; font-weight: 900; line-height: 1.1; }

  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  section { display: flex; flex-direction: column; min-width: 0; margin-bottom: 1.6vh; }
  section.hidden { display: none; }
  h2 {
    font-size: 3.1vh; font-weight: 900; padding: 1.2vh 1.5vw; border-radius: 1.2vh;
    background: rgba(12,42,82,0.1); margin-bottom: 1.4vh; display: flex; align-items: center;
  }
  h2 .ico { margin-right: 0.8vw; }
  h2 .pageinfo { margin-left: auto; font-size: 1.9vh; font-weight: 400; opacity: 0.75; }
  .card {
    background: #0c2a52; color: #fff; border-radius: 1.4vh;
    padding: 1vh 1.8vw; display: flex; align-items: center; margin-bottom: 1.2vh;
  }
  .card .info { flex: 1; min-width: 0; display: flex; align-items: baseline; overflow: hidden; }
  .card .name {
    font-size: 11.6vh; font-weight: 900; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; margin-right: 1.2vw;
  }
  .card .name small { font-weight: 400; color: #9fb4d0; }
  .card .sub { font-size: 3.2vh; color: #9fb4d0; white-space: nowrap; flex-shrink: 0; }
  .card .room {
    font-size: 8.2vh; font-weight: 900; color: #ffd54a; white-space: nowrap;
    margin-left: 1.2vw;
  }
  .empty { opacity: 0.75; font-size: 2.4vh; text-align: center; margin-top: 6vh; }

  /* 4건 이상: 2열 그리드(6건/페이지). 카드 폭이 절반이라 텍스트는 표준 크기. */
  .two-col { display: flex; flex-wrap: wrap; margin-left: -0.6vw; margin-right: -0.6vw; }
  .two-col .card { width: 48.5%; margin-left: 0.6vw; margin-right: 0.6vw; padding: 1.4vh 1.2vw; }
  .two-col .name { font-size: 5.8vh; }
  .two-col .sub { font-size: 2.2vh; }
  .two-col .room { font-size: 4.2vh; }

  /* 일정 없는 날: 로고만 중앙 대형 표시 */
  #idle {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column;
  }
  #idle img { max-height: 30vh; max-width: 60vw; margin: 3vh 0; }
  /* 특별일정: 이미지 하나만 전체화면 */
  #special {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: none;
    background-color: #000; background-size: contain; background-position: center; background-repeat: no-repeat;
    z-index: 10;
  }

  footer { margin-top: 0.4vh; min-height: 4.4vh; display: flex; align-items: center; }
  #notice {
    font-size: 2.4vh; font-weight: 700; background: rgba(12,42,82,0.1);
    border-radius: 1vh; padding: 1vh 1.5vw; width: 100%; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: none;
  }
</style>
</head>
<body>
<div id="bg"></div>
<div id="bg-overlay"></div>
<div id="idle"></div>
<div id="special"></div>
<div class="wrap" id="wrap">
  <header>
    <img id="logo" alt="" style="display:none">
    <div id="title"></div>
    <div class="clockbox">
      <div id="date"></div>
      <div id="clock"></div>
    </div>
  </header>
  <main>
    <section id="sec-edu">
      <h2><span class="ico">📚</span> 오늘의 교육 <span class="pageinfo" id="edu-page"></span></h2>
      <div id="edu-cards"></div>
    </section>
    <section id="sec-rent" class="hidden">
      <h2><span class="ico">🏢</span> 대관 행사 <span class="pageinfo" id="rent-page"></span></h2>
      <div id="rent-cards"></div>
    </section>
  </main>
  <footer><div id="notice"></div></footer>
</div>

<script>
/* 현장 안내 DID — 구형 TV 브라우저 호환판(ES5+Promise, async/await·옵셔널 체이닝 미사용). */
(function () {
  "use strict";
  // 적응형: 오늘 항목 3건 이하 = 1열 대형(3건/페이지), 4건 이상 = 2열(6건/페이지).
  var PAGE_INTERVAL = 10000;

  var courses = [];
  var rentals = [];
  var didCfg = {};
  var pageTick = 0;
  var lastPages = 1;
  var lastDay = "";

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }
  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }

  function tickClock() {
    var d = new Date();
    var days = ["일", "월", "화", "수", "목", "금", "토"];
    $("date").textContent = d.getFullYear() + "." + pad2(d.getMonth() + 1) + "." + pad2(d.getDate()) + " (" + days[d.getDay()] + ")";
    $("clock").textContent = pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }

  function render() {
    var today = todayStr();
    var edu = [];
    var rent = [];
    var i;
    for (i = 0; i < courses.length; i++) {
      var c = courses[i];
      var cs = c.startDate || "";
      var ce = c.endDate || cs;
      // 찾아가는 교육(출장 교육)은 센터 내 안내 대상이 아니므로 표시하지 않는다.
      if ((c.venue || "").replace(/\s+/g, "").indexOf("찾아가") !== -1) continue;
      if (cs <= today && today <= ce) edu.push(c);
    }
    edu.sort(function (a, b) {
      var v = (a.venue || "").localeCompare(b.venue || "");
      return v !== 0 ? v : (a.name || "").localeCompare(b.name || "");
    });
    for (i = 0; i < rentals.length; i++) {
      var r = rentals[i];
      if (r.hidden) continue;
      var rs = r.startDate || "";
      var re = r.endDate || rs;
      if (rs <= today && today <= re) rent.push(r);
    }
    rent.sort(function (a, b) { return (a.startTime || "").localeCompare(b.startTime || ""); });

    var all = [];
    for (i = 0; i < edu.length; i++) all.push({ kind: "edu", v: edu[i] });
    for (i = 0; i < rent.length; i++) all.push({ kind: "rent", v: rent[i] });

    // 특별일정: 지정 이미지 하나만 전체화면 표시(일정과 무관, 최우선).
    var specialEl = $("special");
    if (didCfg.specialOn && didCfg.specialUrl) {
      specialEl.style.backgroundImage = 'url("' + String(didCfg.specialUrl).replace(/"/g, "") + '")';
      specialEl.style.display = "block";
      $("wrap").style.display = "none";
      $("idle").style.display = "none";
      return;
    }
    specialEl.style.display = "none";

    // 일정 없는 날: 등록된 로고(최대 2개)만 중앙 대형 표시.
    var idleEl = $("idle");
    var logos = [];
    if (didCfg.logoUrl) logos.push(didCfg.logoUrl);
    if (didCfg.logoUrl2) logos.push(didCfg.logoUrl2);
    if (all.length === 0 && logos.length) {
      var ih = "";
      for (i = 0; i < logos.length; i++) {
        ih += '<img src="' + esc(logos[i]) + '" alt="">';
      }
      idleEl.innerHTML = ih;
      idleEl.style.display = "flex";
      $("wrap").style.display = "none";
      return;
    }
    idleEl.style.display = "none";
    $("wrap").style.display = "";

    var big = all.length <= 3;              // 1열 대형 모드 여부
    var pageSize = big ? 3 : 6;
    var pages = Math.max(1, Math.ceil(all.length / pageSize));
    lastPages = pages;
    lastDay = today;
    var p = pageTick % pages;
    var label = pages > 1 ? (p + 1) + " / " + pages : "";
    var items = all.slice(p * pageSize, (p + 1) * pageSize);
    var eduItems = [];
    var rentItems = [];
    for (i = 0; i < items.length; i++) {
      if (items[i].kind === "edu") eduItems.push(items[i].v); else rentItems.push(items[i].v);
    }

    $("sec-edu").className = (edu.length > 0 && eduItems.length === 0) ? "hidden" : "";
    $("sec-rent").className = rentItems.length === 0 ? "hidden" : "";
    $("edu-page").textContent = label;
    $("rent-page").textContent = eduItems.length ? "" : label;

    var html = "";
    if (eduItems.length) {
      for (i = 0; i < eduItems.length; i++) {
        var e2 = eduItems[i];
        var period = esc(fmtD(e2.startDate)) + (e2.endDate && e2.endDate !== e2.startDate ? " - " + esc(fmtD(e2.endDate)) : "");
        html += '<div class="card"><div class="info"><div class="name">' + esc(e2.name)
          + '</div><div class="sub">' + period + '</div></div><div class="room">'
          + esc(roomLabel(e2.venue)) + '</div></div>';
      }
    } else {
      html = '<div class="empty">오늘 진행 중인 교육이 없습니다.</div>';
    }
    $("edu-cards").className = big ? "" : "two-col";
    $("edu-cards").innerHTML = html;
    fitNames($("edu-cards"), big);

    html = "";
    for (i = 0; i < rentItems.length; i++) {
      var r2 = rentItems[i];
      var sub = esc(r2.startTime || "") + (r2.endTime ? " - " + esc(r2.endTime) : "") + (r2.note ? " · " + esc(r2.note) : "");
      html += '<div class="card"><div class="info"><div class="name">' + esc(r2.name)
        + '</div><div class="sub">' + sub + '</div></div><div class="room">'
        + esc(roomLabel(r2.venue)) + '</div></div>';
    }
    $("rent-cards").className = big ? "" : "two-col";
    $("rent-cards").innerHTML = html;
    fitNames($("rent-cards"), big);
  }

  // 날짜 축약: "2026-08-13" → "08.13" (연도 생략, 과정명 공간 확보).
  function fmtD(s) {
    s = s || "";
    var m = /^\d{4}-(\d{2})-(\d{2})$/.exec(s);
    return m ? m[1] + "." + m[2] : s;
  }

  // 강의실 앞에 층수를 붙여 안내 효과를 높인다(미등록 장소는 그대로 표시).
  var ROOM_FLOORS = {
    "A강의실": "2층", "B강의실": "2층", "C강의실": "2층", "D강의실": "2층",
    "CBT실습실": "1층", "X-ray실습실": "1층", "온라인스튜디오": "1층"
  };
  function roomLabel(venue) {
    var v = venue || "장소 미정";
    var f = ROOM_FLOORS[v.replace(/\s+/g, "")];
    return f ? f + " " + v : v;
  }

  // 과정/행사명이 칸을 넘치면 글자를 단계적으로 줄여 한 줄에 맞춘다(최소 절반).
  function fitNames(box, big) {
    var names = box.querySelectorAll(".name");
    var vh = window.innerHeight / 100;
    for (var i = 0; i < names.length; i++) {
      var el = names[i];
      var size = (big ? 11.6 : 5.8) * vh;
      var min = (big ? 5.2 : 3.4) * vh;
      el.style.fontSize = size + "px";
      var guard = 0;
      while (el.scrollWidth > el.clientWidth && size > min && guard < 20) {
        size = size * 0.93;
        el.style.fontSize = size + "px";
        guard++;
      }
    }
  }

  function applyConfig(cfg) {
    cfg = cfg || {};
    didCfg = cfg;
    $("title").textContent = cfg.title || "";
    document.title = cfg.title || "KAC 항공보안교육센터";
    $("title").style.display = cfg.title ? "" : "none";
    var n = $("notice");
    n.textContent = cfg.notice || "";
    n.style.display = cfg.notice ? "block" : "none";
    var logo = $("logo");
    if (cfg.logoUrl) { logo.src = cfg.logoUrl; logo.style.display = ""; }
    else { logo.style.display = "none"; }
    var bg = $("bg");
    if (cfg.bgUrl) {
      bg.style.backgroundImage = 'url("' + String(cfg.bgUrl).replace(/"/g, "") + '")';
      $("bg-overlay").style.display = "block";
    } else {
      bg.style.backgroundImage = "";
      $("bg-overlay").style.display = "none";
    }
    render(); // 특별일정·로고 설정 변경 즉시 반영
  }

  function getParam(name) {
    var m = new RegExp("[?&]" + name + "=([^&]*)").exec(location.search);
    return m ? decodeURIComponent(m[1]) : "";
  }

  // 배포 자동 반영: 10분마다 이 페이지의 ETag/Last-Modified를 확인해
  // 변경되면 자동 재로드한다(데이터는 Firestore 실시간이라 이건 코드 배포용).
  var pageTag = null;
  function checkUpdate() {
    var x = new XMLHttpRequest();
    x.open("HEAD", location.pathname + "?t=" + Date.now(), true);
    x.onreadystatechange = function () {
      if (x.readyState !== 4 || x.status < 200 || x.status >= 300) return;
      var tag = (x.getResponseHeader("ETag") || "") + "|" + (x.getResponseHeader("Last-Modified") || "");
      if (tag === "|") return;
      if (pageTag === null) { pageTag = tag; return; }
      if (tag !== pageTag) location.reload();
    };
    x.send();
  }

  function start(db) {
    tickClock();
    setInterval(tickClock, 5000);
    checkUpdate();
    setInterval(checkUpdate, 600000);
    setInterval(function () {
      var dayChanged = todayStr() !== lastDay;
      if (lastPages > 1 || dayChanged) { pageTick++; render(); }
    }, PAGE_INTERVAL);

    db.collection("publicBoard").doc("__did").onSnapshot(function (snap) {
      applyConfig(snap.exists ? snap.data() : {});
    }, function () {});

    db.collection("publicBoard").onSnapshot(function (snap) {
      courses = [];
      snap.forEach(function (d) { if (d.id.indexOf("__") !== 0) courses.push(d.data()); });
      render();
    }, function () {
      $("edu-cards").innerHTML = '<div class="empty">정보를 불러오지 못했습니다.</div>';
    });

    db.collection("rentals").onSnapshot(function (snap) {
      rentals = [];
      snap.forEach(function (d) { rentals.push(d.data()); });
      render();
    }, function () {});
  }

  // 설정 로드(fetch 미지원 구형 대비 XHR) → (?org= 있으면) 허브에서 기관 config 해석 → 시작.
  function loadJson(url, ok, fail) {
    var x = new XMLHttpRequest();
    x.open("GET", url, true);
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status >= 200 && x.status < 300) {
        try { ok(JSON.parse(x.responseText)); } catch (e) { fail(); }
      } else fail();
    };
    x.send();
  }

  loadJson("js/firebase-config.json", function (baseCfg) {
    var org = getParam("org");
    var hub = firebase.initializeApp(baseCfg);
    if (!org) { start(hub.firestore()); return; }
    hub.firestore().collection("orgs").doc(org).get().then(function (snap) {
      var d = snap.exists ? snap.data() : null;
      if (d && d.active !== false && d.config && d.config.apiKey) {
        var app2 = firebase.initializeApp(d.config, "org-" + org);
        start(app2.firestore());
      } else {
        start(hub.firestore());
      }
    }).catch(function () { start(hub.firestore()); });
  }, function () {
    $("edu-cards").innerHTML = '<div class="empty">설정 파일(js/firebase-config.json)을 찾을 수 없습니다. 배포 상태를 확인하세요.</div>';
  });
})();
</script>
</body>
</html>

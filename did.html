<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>현장 안내</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  /* 로비 대형 TV(16:9 가로, LG 86UN891C 등) 상시 표출용 DID */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    color: #fff; background: #0c2a52; overflow: hidden;
  }
  #bg {
    position: fixed; inset: 0; background-size: cover; background-position: center;
    background-image: linear-gradient(165deg, #123c72 0%, #0c2a52 60%, #081c38 100%);
  }
  #bg::after { content: ""; position: absolute; inset: 0; background: rgba(6, 20, 40, 0.55); opacity: 0; }
  #bg.has-img::after { opacity: 1; }  /* 배경 이미지 사용 시 가독성 오버레이 */
  .wrap { position: relative; height: 100vh; display: flex; flex-direction: column; padding: 2.2vh 2.5vw; }

  header { display: flex; align-items: center; gap: 1.5vw; margin-bottom: 2vh; }
  #logo { max-height: 7vh; max-width: 18vw; object-fit: contain; }
  #title { font-size: 3.6vh; font-weight: 900; letter-spacing: 0.05em; }
  .clockbox { margin-left: auto; text-align: right; }
  #date { font-size: 2.2vh; opacity: 0.85; }
  #clock { font-size: 4.6vh; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.1; }

  main { flex: 1; display: flex; flex-direction: column; gap: 1.6vh; min-height: 0; }
  section { display: flex; flex-direction: column; min-width: 0; }
  section.hidden { display: none; }
  h2 {
    font-size: 3.1vh; font-weight: 900; padding: 1.2vh 1.5vw; border-radius: 1.2vh;
    background: rgba(255,255,255,0.14); margin-bottom: 1.4vh; display: flex; align-items: center; gap: 0.8vw;
  }
  h2 .pageinfo { margin-left: auto; font-size: 1.9vh; font-weight: 400; opacity: 0.75; }
  .cards { flex: 1; display: flex; flex-direction: column; gap: 1.4vh; min-height: 0; }
  .card {
    background: rgba(255,255,255,0.93); color: #17304f; border-radius: 1.4vh;
    padding: 2vh 1.8vw; display: flex; align-items: center; gap: 1.2vw;
    animation: fadein 0.5s;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }
  .card .info { flex: 1; min-width: 0; }
  .card .name { font-size: 4.4vh; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .sub { font-size: 2.6vh; color: #5a6c84; margin-top: 0.4vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .room {
    font-size: 4.8vh; font-weight: 900; color: #1a4d8f; white-space: nowrap;
    background: #e8f0fb; border-radius: 1vh; padding: 1vh 1.2vw;
  }
  .empty { opacity: 0.75; font-size: 2.4vh; text-align: center; margin-top: 6vh; }

  footer { margin-top: 1.8vh; min-height: 4.4vh; display: flex; align-items: center; }
  #notice {
    font-size: 2.4vh; font-weight: 700; background: rgba(255,255,255,0.14);
    border-radius: 1vh; padding: 1vh 1.5vw; width: 100%; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #notice:empty { display: none; }
</style>
</head>
<body>
<div id="bg"></div>
<div class="wrap">
  <header>
    <img id="logo" alt="" hidden>
    <div id="title">현장 안내</div>
    <div class="clockbox">
      <div id="date"></div>
      <div id="clock"></div>
    </div>
  </header>
  <main>
    <section id="sec-edu">
      <h2>📚 오늘의 교육 <span class="pageinfo" id="edu-page"></span></h2>
      <div class="cards" id="edu-cards"></div>
    </section>
    <section id="sec-rent">
      <h2>🏢 대관 행사 <span class="pageinfo" id="rent-page"></span></h2>
      <div class="cards" id="rent-cards"></div>
    </section>
  </main>
  <footer><div id="notice"></div></footer>
</div>
<script type="module" src="js/did.js"></script>
</body>
</html>
